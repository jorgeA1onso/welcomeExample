sources:
  docker_logs_source:
    type: docker_logs
    include_containers:
      - "vector-1"
      - "vector-2"

  file_logs_source:
    type: file
    include:
      - /tmp/vector-test/test.log

transforms:
  parse:
    type: remap
    inputs:
      - file_logs_source
    source: |
      . = parse_json!(.message)

sinks:
  my_sqs:
    type: aws_sqs
    inputs:
      - parse
      - docker_logs_source
      - file_logs_source
    queue_url: "https://sqs.us-east-2.amazonaws.com/084801557044/quew-one-with-vector"
    region: us-east-2
    encoding:
      codec: json


